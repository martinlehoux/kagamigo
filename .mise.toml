[tasks.templates]
description = "Generate templ files"
run = "go tool templ generate"

[tasks.gettext]
description = "Generate gettext translation files"
run = "go run github.com/martinlehoux/kagamigo/ki18n/cmd/gettext"

[tasks.check]
description = "Run formatting, static, security, lint, race, and module checks"
run = [
  "gofmt -d -e -s .",
  "go vet ./...",
  "go tool staticcheck ./...",
  "go tool gosec -quiet ./...",
  "go tool golangci-lint run",
  "go tool govulncheck",
  "go test -race ./...",
  "go tool revive",
  "go mod tidy",
  "mise run gettext",
]

[tasks.tools]
description = "Install development tools"
run = [
  "go get -tool github.com/a-h/templ/cmd/templ",
  "go get -tool github.com/amacneil/dbmate",
  "go get -tool github.com/golangci/golangci-lint/v2/cmd/golangci-lint",
  "go get -tool github.com/securego/gosec/v2/cmd/gosec",
  "go get -tool golang.org/x/vuln/cmd/govulncheck",
  "go get -tool honnef.co/go/tools/cmd/staticcheck",
]

[tasks.test]
description = "Run tests and open the coverage report"
run = [
  "go test -v -cover -coverprofile=coverage.out ./...",
  "go tool cover -html=coverage.out",
]
